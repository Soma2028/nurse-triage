# main に push したとき・プルリクエストのときに、テスト・lint・ビルド・画面の自動テストを回す。
# 公開（Vercel のデプロイ）とは別に動く。通らなければ GitHub のメールと、コミットの横の ✕ で知らせる
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      # 画面の自動テスト（iPhone と同じ WebKit と、電波がないときのテストの Chromium）
      - run: npx playwright install --with-deps webkit chromium
      - run: npm run e2e

      - name: 画面の自動テストの結果を残す（失敗したとき）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
